<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Personal Expense Tracker</h1>
    <p>Mange your money easily.</p>

    <div class="dashboard">

       <div class="card">
        <h2>Total Balance</h2>
        <p id="balance">0 SAR</p>
    </div>

    <div class="card">
        <h2>Total Income</h2>
        <p id="income">0 SAR</p>
    </div>

    <div class="card">
        <h2>Total Expenses</h2>
        <p id="expenses">0 SAR</p>
        </div>


    </div>

    <button id="add-transaction-btn">add Transaction</button>

    <div id="transaction-form" hidden>

        <h2>New Transaction</h2>

        <label>Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount">

        <label>Type:</label>
        <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
        </select>

        <label>Description:</label>
        <input type="text" id="description" placeholder="Enter description">

        <button type="button" id="save-btn">Save Transaction</button>

    </div>
    <h2>Recent Transaction</h2>
    <ul id="transaction-list"></ul>
    <script src="script.js"></script>


</body>

</html>
